name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      envoy_version:
        description: Unprefixed Envoy semantic version to embed in the executable
        required: true
        default: 0.6.2
        type: string

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: [self-hosted, X64, Windows]
    env:
      ENVOY_RELEASE: v${{ inputs.envoy_version || '0.6.2' }}
      ENVOY_BUILD_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      ENVOY_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Bootstrap selected Envoy release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .\scripts\install-envoy-release.ps1
          -ReleaseTag "$env:ENVOY_RELEASE"

      - name: Validate repository build Stack
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ENVOY_BUILD_STACK -PathType Leaf)) {
            throw "Repository build Stack is unavailable: '$env:ENVOY_BUILD_STACK'."
          }

      - name: Install executable build tools
        shell: pwsh
        run: |
          $sitePackages = Join-Path $env:ENVOY_SITE_PACKAGES 'Python311\site-packages'
          python -m pip install `
            --disable-pip-version-check --upgrade --target $sitePackages `
            '.[docs]' 'PyInstaller==6.21.0'

      - name: Build executable
        shell: pwsh
        run: .\scripts\build-executable.ps1 -SkipToolInstall

      - name: Verify executable starts
        shell: pwsh
        run: |
          $process = Start-Process `
              -FilePath .\dist\despatch.exe `
              -ArgumentList '--version' `
              -Wait `
              -PassThru
          if ($process.ExitCode -ne 0) {
            throw "despatch.exe --version failed with exit code $($process.ExitCode)."
          }

      - name: Verify bundled documentation
        shell: pwsh
        run: |
          $readyPath = Join-Path $env:RUNNER_TEMP 'despatch-docs-ready.json'
          function Stop-ProcessTree {
            param([int]$ProcessId)
            $childIds = @(
              Get-CimInstance Win32_Process -Filter "ParentProcessId = $ProcessId" |
                Select-Object -ExpandProperty ProcessId
            )
            foreach ($childId in $childIds) {
              Stop-ProcessTree -ProcessId $childId
            }
            Stop-Process -Id $ProcessId -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath $readyPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
              -FilePath .\dist\despatch.exe `
              -ArgumentList '--docs-server', $readyPath `
              -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while (-not (Test-Path -LiteralPath $readyPath)) {
              if ($process.HasExited) {
                throw "Documentation helper exited with code $($process.ExitCode)."
              }
              if ([DateTime]::UtcNow -ge $deadline) {
                throw 'Timed out waiting for the documentation helper.'
              }
              Start-Sleep -Milliseconds 100
            }
            $ready = Get-Content -LiteralPath $readyPath -Raw | ConvertFrom-Json
            if ($ready.error) {
              throw "Documentation helper failed: $($ready.error)"
            }
            $response = Invoke-WebRequest -Uri $ready.url -UseBasicParsing
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch '<title>Despatch') {
              throw 'The bundled documentation home page is invalid.'
            }
            $asset = Invoke-WebRequest -Uri "$($ready.url)search/search_index.json" -UseBasicParsing
            if ($asset.StatusCode -ne 200) {
              throw 'The bundled documentation search index is unavailable.'
            }
          } finally {
            Stop-ProcessTree -ProcessId $process.Id
            Remove-Item -LiteralPath $readyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: despatch-${{ github.ref_name }}-windows-x64
          path: dist/despatch.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/despatch.exe
          fail_on_unmatched_files: true

      - name: Read release state
        if: startsWith(github.ref, 'refs/tags/')
        id: release-state
        shell: pwsh
        run: python scripts/release_automation.py check --github-output $env:GITHUB_OUTPUT

      - name: Close matching Envoy impact issue
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        env:
          ENVOY_TAG: ${{ steps.release-state.outputs.envoy_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = `<!-- envoy-compatibility:${process.env.ENVOY_TAG} -->`;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find(candidate => candidate.body?.includes(marker));
            if (issue === undefined) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Released ${process.env.RELEASE_TAG} embedding ${process.env.ENVOY_TAG}.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });
