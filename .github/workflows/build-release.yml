name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      envoy_version:
        description: Unprefixed Envoy semantic version to embed in the executable
        required: true
        default: 0.6.2
        type: string

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: [self-hosted, X64, Windows]
    env:
      ENVOY_RELEASE: v${{ inputs.envoy_version || '0.6.2' }}
      ENVOY_BUILD_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      ENVOY_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      # The build Stack pins its bundles as ${ENVOY_STUDIO_BNDLS}/..., so the
      # variable must be set or the Stack fails to load outright. Prefer a
      # repository/organization variable so a differently-provisioned runner
      # can point at its own share without editing this workflow; the literal
      # is only a fallback for the current self-hosted runner.
      ENVOY_STUDIO_BNDLS: ${{ vars.ENVOY_STUDIO_BNDLS || '//THO_CLOUD/gavyn/studio/envoy/bndl' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Compute artifact reference
        shell: pwsh
        run: |
          # github.ref_name is the bare tag on a real release push (e.g.
          # "v0.6.2"), but a manual workflow_dispatch test run against a
          # feature branch can contain slashes -- invalid in an artifact
          # name. Sanitize once and reuse everywhere below.
          $artifactRef = $env:GITHUB_REF_NAME -replace '/', '-'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ARTIFACT_REF=$artifactRef"

      - name: Bootstrap selected Envoy release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .\scripts\install-envoy-release.ps1
          -ReleaseTag "$env:ENVOY_RELEASE"

      - name: Validate repository build Stack
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ENVOY_BUILD_STACK -PathType Leaf)) {
            throw "Repository build Stack is unavailable: '$env:ENVOY_BUILD_STACK'."
          }

      - name: Install executable build tools
        shell: pwsh
        run: |
          $sitePackages = Join-Path $env:ENVOY_SITE_PACKAGES 'Python311\site-packages'
          python -m pip install `
            --disable-pip-version-check --upgrade --target $sitePackages `
            '.[docs]' 'PyInstaller==6.21.0'

      - name: Build executable
        shell: pwsh
        run: .\scripts\build-executable.ps1 -SkipToolInstall

      - name: Verify executable starts
        shell: pwsh
        run: |
          $process = Start-Process `
              -FilePath .\dist\despatch.exe `
              -ArgumentList '--version' `
              -Wait `
              -PassThru
          if ($process.ExitCode -ne 0) {
            throw "despatch.exe --version failed with exit code $($process.ExitCode)."
          }

      - name: Verify bundled documentation
        shell: pwsh
        run: |
          $readyPath = Join-Path $env:RUNNER_TEMP 'despatch-docs-ready.json'
          function Stop-ProcessTree {
            param([int]$ProcessId)
            $childIds = @(
              Get-CimInstance Win32_Process -Filter "ParentProcessId = $ProcessId" |
                Select-Object -ExpandProperty ProcessId
            )
            foreach ($childId in $childIds) {
              Stop-ProcessTree -ProcessId $childId
            }
            Stop-Process -Id $ProcessId -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath $readyPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
              -FilePath .\dist\despatch.exe `
              -ArgumentList '--docs-server', $readyPath `
              -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while (-not (Test-Path -LiteralPath $readyPath)) {
              if ($process.HasExited) {
                throw "Documentation helper exited with code $($process.ExitCode)."
              }
              if ([DateTime]::UtcNow -ge $deadline) {
                throw 'Timed out waiting for the documentation helper.'
              }
              Start-Sleep -Milliseconds 100
            }
            $ready = Get-Content -LiteralPath $readyPath -Raw | ConvertFrom-Json
            if ($ready.error) {
              throw "Documentation helper failed: $($ready.error)"
            }
            $response = Invoke-WebRequest -Uri $ready.url -UseBasicParsing
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch '<title>Despatch') {
              throw 'The bundled documentation home page is invalid.'
            }
            $asset = Invoke-WebRequest -Uri "$($ready.url)search/search_index.json" -UseBasicParsing
            if ($asset.StatusCode -ne 200) {
              throw 'The bundled documentation search index is unavailable.'
            }
          } finally {
            Stop-ProcessTree -ProcessId $process.Id
            Remove-Item -LiteralPath $readyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: despatch-${{ env.ARTIFACT_REF }}-windows-x64
          path: dist/despatch.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/despatch.exe
          fail_on_unmatched_files: true

      - name: Read release state
        if: startsWith(github.ref, 'refs/tags/')
        id: release-state
        shell: pwsh
        run: python scripts/release_automation.py check --github-output $env:GITHUB_OUTPUT

      - name: Close matching Envoy impact issue
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        env:
          ENVOY_TAG: ${{ steps.release-state.outputs.envoy_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = `<!-- envoy-compatibility:${process.env.ENVOY_TAG} -->`;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find(candidate => candidate.body?.includes(marker));
            if (issue === undefined) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Released ${process.env.RELEASE_TAG} embedding ${process.env.ENVOY_TAG}.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });

  build-unix:
    name: Build ${{ matrix.os_name }} executable
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: Linux
            artifact_suffix: linux-x64
          - runner: macos-latest
            os_name: macOS
            artifact_suffix: macos
    runs-on: ${{ matrix.runner }}
    env:
      ENVOY_RELEASE: v${{ inputs.envoy_version || '0.6.2' }}
    # No Linux/macOS build of the ext:python / ext:pyside Envoy bundles this
    # repository's build Stack pins exists yet -- see lint.yml for the same
    # note. PySide6/Qt.py are installed directly via pip here (matching
    # pyproject.toml's exact pins) instead of resolved through envoy's Stack;
    # envoy itself (CLI + Python API) is still sourced from the real,
    # already-cross-platform release via install-envoy-release.ps1.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Compute artifact reference
        shell: pwsh
        run: |
          # See the Windows job's identically-named step for why this is
          # sanitized rather than using github.ref_name directly.
          $artifactRef = $env:GITHUB_REF_NAME -replace '/', '-'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ARTIFACT_REF=$artifactRef"

      - name: Bootstrap selected Envoy release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/install-envoy-release.ps1
          -ReleaseTag "$env:ENVOY_RELEASE"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # See lint.yml's python-unix job for why these are needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0

      - name: Install executable build tools
        shell: pwsh
        run: |
          $sitePackages = Join-Path $env:ENVOY_SITE_PACKAGES 'site-packages'
          python -m pip install `
            --disable-pip-version-check --upgrade --target $sitePackages `
            '.[docs]' 'PyInstaller==6.21.0' 'PySide6==6.11.1' 'Qt.py==2.0.5'

      - name: Build executable
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:ENVOY_SITE_PACKAGES 'site-packages'
          $pythonPath = (Get-Command python).Source
          ./scripts/build-executable.ps1 -SkipToolInstall -PythonExecutable $pythonPath

      - name: Verify executable starts
        shell: pwsh
        run: |
          $binary = if ('${{ matrix.os_name }}' -eq 'macOS') {
            Join-Path (Join-Path (Join-Path 'dist' 'Despatch.app') 'Contents' 'MacOS') 'Despatch'
          } else {
            Join-Path 'dist' 'despatch'
          }
          & chmod +x $binary
          & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "$binary --version failed with exit code $LASTEXITCODE."
          }

      - name: Verify bundled documentation
        shell: pwsh
        run: |
          $binary = if ('${{ matrix.os_name }}' -eq 'macOS') {
            Join-Path (Join-Path (Join-Path 'dist' 'Despatch.app') 'Contents' 'MacOS') 'Despatch'
          } else {
            Join-Path 'dist' 'despatch'
          }
          $readyPath = Join-Path $env:RUNNER_TEMP 'despatch-docs-ready.json'
          Remove-Item -LiteralPath $readyPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
              -FilePath $binary `
              -ArgumentList '--docs-server', $readyPath `
              -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while (-not (Test-Path -LiteralPath $readyPath)) {
              if ($process.HasExited) {
                throw "Documentation helper exited with code $($process.ExitCode)."
              }
              if ([DateTime]::UtcNow -ge $deadline) {
                throw 'Timed out waiting for the documentation helper.'
              }
              Start-Sleep -Milliseconds 100
            }
            $ready = Get-Content -LiteralPath $readyPath -Raw | ConvertFrom-Json
            if ($ready.error) {
              throw "Documentation helper failed: $($ready.error)"
            }
            $response = Invoke-WebRequest -Uri $ready.url -UseBasicParsing
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch '<title>Despatch') {
              throw 'The bundled documentation home page is invalid.'
            }
            $asset = Invoke-WebRequest -Uri "$($ready.url)search/search_index.json" -UseBasicParsing
            if ($asset.StatusCode -ne 200) {
              throw 'The bundled documentation search index is unavailable.'
            }
          } finally {
            # The helper spawns its own HTTP-server child process, so a plain
            # `Stop-Process` on the parent alone would leak it. `pkill -P`
            # (available on both Linux and macOS) targets direct children;
            # this process tree is only one level deep (helper -> server),
            # so a single pass is sufficient here.
            & pkill -P $process.Id 2>$null
            Start-Sleep -Milliseconds 200
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $readyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: despatch-${{ env.ARTIFACT_REF }}-${{ matrix.artifact_suffix }}
          path: ${{ matrix.os_name == 'macOS' && 'dist/Despatch.app' || 'dist/despatch' }}
          if-no-files-found: error

      - name: Resolve release asset path
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $assetPath = if ('${{ matrix.os_name }}' -eq 'macOS') {
            # softprops/action-gh-release only accepts single files, and a
            # release asset can't be a directory -- zip the .app bundle so
            # Finder can still unpack it as a normal double-clickable app.
            $zipPath = 'dist/despatch-${{ env.ARTIFACT_REF }}-macos.zip'
            Compress-Archive -LiteralPath 'dist/Despatch.app' -DestinationPath $zipPath
            $zipPath
          } else {
            $renamedPath = 'dist/despatch-${{ env.ARTIFACT_REF }}-linux-x64'
            Copy-Item -LiteralPath 'dist/despatch' -Destination $renamedPath
            $renamedPath
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_ASSET_PATH=$assetPath"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ASSET_PATH }}
          fail_on_unmatched_files: true
