name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unprefixed Despatch semantic version
        required: true
        type: string
      envoy_version:
        description: Unprefixed published Envoy semantic version to embed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: [self-hosted, X64, Windows]
    env:
      ENVOY_BUILD_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      ENVOY_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      ENVOY_TAG: v${{ inputs.envoy_version }}

    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: despatch,envoy

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Bootstrap requested Envoy release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          .\scripts\install-envoy-release.ps1
          -ReleaseTag "$env:ENVOY_TAG"

      - name: Validate repository build Stack
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ENVOY_BUILD_STACK -PathType Leaf)) {
            throw "Repository build Stack is unavailable: '$env:ENVOY_BUILD_STACK'."
          }

      - name: Install development dependencies
        shell: pwsh
        run: |
          $sitePackages = Join-Path $env:ENVOY_SITE_PACKAGES 'Python311\site-packages'
          python -m pip install `
            --disable-pip-version-check --upgrade --target $sitePackages '.[dev]'

      - name: Prepare version and Envoy pin
        run: >-
          envoy --stack="$env:ENVOY_BUILD_STACK" python scripts/release_automation.py prepare
          --version "${{ inputs.version }}"
          --envoy-version "${{ inputs.envoy_version }}"

      - name: Test source
        run: envoy --stack="$env:ENVOY_BUILD_STACK" python -m pytest

      - name: Lint source
        run: envoy --stack="$env:ENVOY_BUILD_STACK" python -m ruff check .

      - name: Check source formatting
        run: envoy --stack="$env:ENVOY_BUILD_STACK" python -m ruff format --check .

      - name: Ensure release preparation label exists
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const label = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'release-prep',
              color: '5319E7',
              description: 'Automated release preparation pull request',
            };
            try {
              await github.rest.issues.updateLabel(label);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel(label);
            }

      - name: Create or update draft pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/release-v${{ inputs.version }}
          base: main
          commit-message: Prepare v${{ inputs.version }} release
          title: Prepare v${{ inputs.version }} release
          body: |
            Automated Despatch release preparation.

            - Synchronizes the Python package version.
            - Pins the executable build to Envoy `v${{ inputs.envoy_version }}`.
            - Runs the source release-readiness checks.

            Merge only after the normal pull request checks pass.
          labels: release-prep
          draft: always-true
          delete-branch: false
